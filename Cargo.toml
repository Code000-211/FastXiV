[package]
name = "fastxiv"
version = "0.1.0"
edition = "2021"
description = "Local arXiv search for LLM agents: docsearch (BM25 + entity graph + PPR) behind an MCP server"

[dependencies]
# The search core of µPi's project_search, pinned to a commit of microPi.
docsearch-core = { git = "https://github.com/Code000-211/microPi", rev = "cf3f1f4da9523000d72415b72ee500936a3ddb1e" }
quick-xml = "0.37"
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
